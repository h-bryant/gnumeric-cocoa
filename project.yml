# XcodeGen spec (HANDOFF.md §4, Phase 1).  Generate with:
#   scripts/gen-xcconfig.sh && xcodegen generate
# The .xcodeproj is ignored by git; this file and build/engine.xcconfig are
# the source of truth.  `xcodebuild test -scheme GnumericCocoa` runs the
# bridge tests: each program in Tests/BridgeTests is a tool target that the
# BridgeTests bundle launches as a subprocess (one engine per process).
# Tests/BridgeTests/run.sh does the same without Xcode.
name: GnumericCocoa
options:
  bundleIdPrefix: io.github.h-bryant
  # Minimum macOS = Homebrew's oldest supported release at release time
  # (docs/decisions.md ADR-009); 15 as of 2026-10-10.
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
configFiles:
  Debug: build/engine.xcconfig
  Release: build/engine.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targetTemplates:
  BridgeTestProgram:
    type: tool
    platform: macOS
    sources:
      - path: Tests/BridgeTests/${target_name}.m
      - path: Tests/BridgeTests/GnmTest.h
        buildPhase: none
    dependencies:
      - target: GnmCocoa
    settings:
      base:
        CLANG_ENABLE_MODULES: NO
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/Bridge/include $(GNM_HEADER_SEARCH_PATHS)"
        OTHER_CFLAGS: "$(GNM_OTHER_CFLAGS)"
        LIBRARY_SEARCH_PATHS: "$(GNM_LIBRARY_SEARCH_PATHS)"
        OTHER_LDFLAGS: "$(GNM_OTHER_LDFLAGS) -ObjC -framework Foundation -framework AppKit -framework CoreGraphics -framework ImageIO -framework CoreServices"
targets:
  engine_lifecycle:
    templates: [BridgeTestProgram]
  workbook_io:
    templates: [BridgeTestProgram]
  render:
    templates: [BridgeTestProgram]
  runloop:
    templates: [BridgeTestProgram]
  editing:
    templates: [BridgeTestProgram]
  format:
    templates: [BridgeTestProgram]
  objects:
    templates: [BridgeTestProgram]
  chart:
    templates: [BridgeTestProgram]
  search:
    templates: [BridgeTestProgram]
  preferences:
    templates: [BridgeTestProgram]
  text_export:
    templates: [BridgeTestProgram]
  text_import:
    templates: [BridgeTestProgram]
  comments:
    templates: [BridgeTestProgram]
  names:
    templates: [BridgeTestProgram]
  fill_series:
    templates: [BridgeTestProgram]
  goal_seek:
    templates: [BridgeTestProgram]
  conditional:
    templates: [BridgeTestProgram]
  analysis:
    templates: [BridgeTestProgram]
  validation:
    templates: [BridgeTestProgram]
  BridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BridgeTests/XCTest
    dependencies:
      - target: engine_lifecycle
      - target: workbook_io
      - target: render
      - target: runloop
      - target: editing
      - target: format
      - target: objects
      - target: chart
      - target: search
      - target: preferences
      - target: text_export
      - target: text_import
      - target: comments
      - target: names
      - target: fill_series
      - target: goal_seek
      - target: conditional
      - target: analysis
      - target: validation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.h-bryant.gnumeric-cocoa.BridgeTests
        GENERATE_INFOPLIST_FILE: YES
  GnmCocoa:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/Bridge
        excludes:
          - "include/**"
      - path: Sources/Bridge/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: GnmCocoa
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/Bridge/include $(SRCROOT)/Sources/Bridge $(GNM_HEADER_SEARCH_PATHS)"
        OTHER_CFLAGS: "$(GNM_OTHER_CFLAGS)"
        PUBLIC_HEADERS_FOLDER_PATH: include
        # The bridge imports plain headers; with modules on, the Homebrew
        # include paths break the SDK's own module builds (Darwin,
        # CoreFoundation).  The Swift target still builds the GnmCocoa module
        # from the umbrella header, which has no Homebrew includes.
        CLANG_ENABLE_MODULES: NO
  GnumericCocoa:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
    dependencies:
      - target: GnmCocoa
    settings:
      base:
        PRODUCT_NAME: GnumericCocoa
        PRODUCT_BUNDLE_IDENTIFIER: io.github.h-bryant.gnumeric-cocoa
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/Bridge/include"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/Bridge/include"
        LIBRARY_SEARCH_PATHS: "$(GNM_LIBRARY_SEARCH_PATHS)"
        OTHER_LDFLAGS: "$(GNM_OTHER_LDFLAGS) -ObjC"
        # Development builds run the engine from build/prefix (Phase 6 moves
        # it into the bundle); AppDelegate reads this key.
        INFOPLIST_PREPROCESS: NO
schemes:
  GnumericCocoa:
    build:
      targets:
        GnumericCocoa: all
        BridgeTests: [test]
    run:
      config: Debug
      environmentVariables:
        GNM_PREFIX: "$(GNM_PREFIX)"
    test:
      config: Debug
      targets:
        - BridgeTests
      environmentVariables:
        GNM_PREFIX: "$(GNM_PREFIX)"
        GNM_REPO_ROOT: "$(SRCROOT)"
